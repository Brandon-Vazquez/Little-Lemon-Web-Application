{% extends 'base.html' %}
{% load static %}

{% block content %}
<section>
  <article>
    <h1>Reservations</h1>
    <!--Begin row-->
    <div class="row">
      <!--Begin col-->
      <div class="column">
        <label for="res-date">Select date:</label>
        <input type="date" id="res-date" name="res-date">
        <pre id="bookings"></pre>
      </div>
      <!--End col-->

      <!--Begin col-->
      <div class="column">
        <div class="videowrap">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d11898.289517452584!2d-87.60853049433447!3d41.79442860243028!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x880e2912ce6f7027%3A0xc0cfb5545d4a37b2!2sHyde%20Park%2C%20Chicago%2C%20IL%2C%20USA!5e0!3m2!1sen!2spt!4v1662384760663!5m2!1sen!2spt"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </div>
      <!--End col-->
    </div>
    <!--End row-->




  </article>
</section>

<script>
  function todayISO() {
    var today = new Date();
    var month = String(today.getMonth() + 1).padStart(2, '0');
    var day = String(today.getDate()).padStart(2, '0');
    return today.getFullYear() + '-' + month + '-' + day;
  }

  function loadBookings(date) {
    fetch('/bookings?date=' + date)
      .then(function (response) {
        return response.json();
      })
      .then(function (data) {
        var bookings = JSON.parse(data);
        var pre = document.getElementById('bookings');
        if (bookings.length === 0) {
          pre.textContent = 'No Booking';
        } else {
          pre.textContent = JSON.stringify(bookings, null, 2);
        }
      });
  }

  document.addEventListener('DOMContentLoaded', function () {
    var dateInput = document.getElementById('res-date');
    dateInput.value = todayISO();
    loadBookings(dateInput.value);

    dateInput.addEventListener('change', function () {
      loadBookings(dateInput.value);
    });
  });
</script>
{% endblock %}
